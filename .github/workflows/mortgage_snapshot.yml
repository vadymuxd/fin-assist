name: Mortgage Snapshot

on:
  schedule:
    # 1st of every month at 08:00 BST = 07:00 UTC
    - cron: '0 7 1 * *'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run mortgage snapshot
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_REVALIDATE_URL:         ${{ secrets.APP_REVALIDATE_URL }}
          APP_REVALIDATE_SECRET:      ${{ secrets.APP_REVALIDATE_SECRET }}
        run: python3 scripts/mortgage_snapshot.py
