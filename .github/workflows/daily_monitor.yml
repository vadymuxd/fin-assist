name: Daily Monitor

on:
  schedule:
    # 1× daily weekdays: 16:30 BST (= 15:30 UTC) — end-of-day close run.
    # Reduced from 3× daily (2026-06-07) to cut API cost; kept the close run so
    # the daily snapshot + EOD prices still land. Intraday alert sweeps dropped.
    - cron: '30 15 * * 1-5'  # Close — 16:30 BST
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account credentials
        run: |
          mkdir -p config
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > config/service_account.json

      # ── Refresh manual prices (SGLN — not available via GOOGLEFINANCE) ──────
      - name: Refresh manual prices
        env:
          PORTFOLIO_SHEET_ID:             ${{ secrets.PORTFOLIO_SHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: config/service_account.json
          ALPHAVANTAGE_API_KEY:           ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python3 scripts/update_manual_prices.py

      # ── market_worker --mode fetch: build news pool ───────────────────────────
      - name: Fetch news
        env:
          FINNHUB_API_KEY:                ${{ secrets.FINNHUB_API_KEY }}
          ALPHAVANTAGE_API_KEY:           ${{ secrets.ALPHAVANTAGE_API_KEY }}
          MARKETAUX_API_KEY:              ${{ secrets.MARKETAUX_API_KEY }}
          CLAUDE_API_KEY:                 ${{ secrets.CLAUDE_API_KEY }}
          PORTFOLIO_SHEET_ID:             ${{ secrets.PORTFOLIO_SHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: config/service_account.json
          SUPABASE_URL:                   ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:      ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_REVALIDATE_URL:             ${{ secrets.APP_REVALIDATE_URL }}
          APP_REVALIDATE_SECRET:          ${{ secrets.APP_REVALIDATE_SECRET }}
        run: python3 scripts/market_worker.py --mode fetch

      # ── 5-minute gap (checkpoint: data/news_pool.json exists) ─────────────────
      - name: Wait 5 minutes
        run: sleep 300

      # ── market_worker --mode assess: score holdings + prospects ───────────────
      - name: Assess stocks
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: python3 scripts/market_worker.py --mode assess

      # ── 5-minute gap (checkpoint: data/assessments.json exists) ───────────────
      - name: Wait 5 minutes
        run: sleep 300

      # ── market_worker --mode dispatch: dedup, log, send Telegram ─────────────
      - name: Dispatch alerts
        env:
          PORTFOLIO_SHEET_ID:             ${{ secrets.PORTFOLIO_SHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: config/service_account.json
          TELEGRAM_BOT_TOKEN:             ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:               ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL:                   ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:      ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_REVALIDATE_URL:             ${{ secrets.APP_REVALIDATE_URL }}
          APP_REVALIDATE_SECRET:          ${{ secrets.APP_REVALIDATE_SECRET }}
        run: python3 scripts/market_worker.py --mode dispatch

      # ── Drain Notion NL queue → Sheets → Supabase → Notion ──────────────────────
      - name: sync_worker + snapshots + Notion
        env:
          PORTFOLIO_SHEET_ID:             ${{ secrets.PORTFOLIO_SHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: config/service_account.json
          NOTION_API_KEY:                 ${{ secrets.NOTION_API_KEY }}
          SUPABASE_URL:                   ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:      ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN:             ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:               ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_REVALIDATE_URL:             ${{ secrets.APP_REVALIDATE_URL }}
          APP_REVALIDATE_SECRET:          ${{ secrets.APP_REVALIDATE_SECRET }}
          # Defer sync_worker's own Telegram message so snapshot_worker sends
          # ONE combined message (Monzo + Notion queue + Sheet snapshot)
          # instead of separate ones — and stays silent entirely if this
          # scheduled run found nothing new (no BOT_SYNC_TELEGRAM here).
          DEFER_SYNC_TELEGRAM:            "1"
        # Phase 18: Monzo sync first (new rows → monzo_transactions), then
        # feature.1 recognises savings/investment transfers among them and
        # queues Financial Updates entries, then drain Notion Financial
        # Updates, then snapshot so final numbers are current.
        run: |
          python3 scripts/monzo_sync.py
          python3 scripts/monzo_balance_sync.py
          python3 scripts/sync_worker.py
          python3 scripts/snapshot_worker.py --domain all
          python3 scripts/sheets_updater.py --snapshot
