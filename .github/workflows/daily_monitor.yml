name: Daily Monitor

on:
  schedule:
    # 3× daily weekdays: 09:30, 13:00, 16:30 BST (= 08:30, 12:00, 15:30 UTC)
    - cron: '30 8 * * 1-5'   # Morning  — 09:30 BST
    - cron: '0 12 * * 1-5'   # Midday   — 13:00 BST
    - cron: '30 15 * * 1-5'  # Close    — 16:30 BST
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account credentials
        run: |
          mkdir -p config
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > config/service_account.json

      # Event-driven holdings check — silent unless a concrete event triggers an ACT alert
      - name: Holdings monitor (auto)
        env:
          FINNHUB_API_KEY:                ${{ secrets.FINNHUB_API_KEY }}
          ALPHAVANTAGE_API_KEY:           ${{ secrets.ALPHAVANTAGE_API_KEY }}
          CLAUDE_API_KEY:                 ${{ secrets.CLAUDE_API_KEY }}
          PORTFOLIO_SHEET_ID:             ${{ secrets.PORTFOLIO_SHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: config/service_account.json
          TELEGRAM_BOT_TOKEN:             ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:               ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/holdings_monitor.py --auto

      # Dynamic prospect discovery — silent unless a new BUY emerges
      - name: Prospect discovery (auto)
        env:
          FINNHUB_API_KEY:                ${{ secrets.FINNHUB_API_KEY }}
          ALPHAVANTAGE_API_KEY:           ${{ secrets.ALPHAVANTAGE_API_KEY }}
          CLAUDE_API_KEY:                 ${{ secrets.CLAUDE_API_KEY }}
          PORTFOLIO_SHEET_ID:             ${{ secrets.PORTFOLIO_SHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: config/service_account.json
          TELEGRAM_BOT_TOKEN:             ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:               ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/prospect_discovery.py --auto

      # Close-run only: refresh sheet scores + Notion portfolio snapshot
      - name: Sheet scores + Notion snapshot (close run only)
        env:
          PORTFOLIO_SHEET_ID:             ${{ secrets.PORTFOLIO_SHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: config/service_account.json
          NOTION_API_KEY:                 ${{ secrets.NOTION_API_KEY }}
        run: |
          HOUR=$(date -u +"%H")
          MINUTE=$(date -u +"%M")
          if [ "$HOUR" = "15" ] && [ "$MINUTE" = "30" ]; then
            python3 scripts/sheets_updater.py --snapshot
          else
            python3 scripts/sheets_updater.py
          fi
