name: Daily Monitor

on:
  schedule:
    # 3× daily weekdays: 09:30, 13:00, 16:30 BST (= 08:30, 12:00, 15:30 UTC)
    - cron: '30 8 * * 1-5'   # Morning  — 09:30 BST
    - cron: '0 12 * * 1-5'   # Midday   — 13:00 BST
    - cron: '30 15 * * 1-5'  # Close    — 16:30 BST
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account credentials
        run: |
          mkdir -p config
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > config/service_account.json

      # ── Refresh manual prices (SGLN and other non-GOOGLEFINANCE tickers) ──────
      - name: Refresh manual prices
        env:
          PORTFOLIO_SHEET_ID:             ${{ secrets.PORTFOLIO_SHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: config/service_account.json
        run: python3 scripts/update_manual_prices.py

      # ── Script A: fetch + curate news from all sources ────────────────────────
      - name: Script A — Fetch news
        env:
          FINNHUB_API_KEY:                ${{ secrets.FINNHUB_API_KEY }}
          ALPHAVANTAGE_API_KEY:           ${{ secrets.ALPHAVANTAGE_API_KEY }}
          MARKETAUX_API_KEY:              ${{ secrets.MARKETAUX_API_KEY }}
          CLAUDE_API_KEY:                 ${{ secrets.CLAUDE_API_KEY }}
          PORTFOLIO_SHEET_ID:             ${{ secrets.PORTFOLIO_SHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: config/service_account.json
          SUPABASE_URL:                   ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:      ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_REVALIDATE_URL:             ${{ secrets.APP_REVALIDATE_URL }}
          APP_REVALIDATE_SECRET:          ${{ secrets.APP_REVALIDATE_SECRET }}
        run: python3 scripts/news_fetcher.py

      # ── 5-minute gap between Script A and B ───────────────────────────────────
      - name: Wait 5 minutes
        run: sleep 300

      # ── Script B: assess stocks, produce only actionable findings ─────────────
      - name: Script B — Assess stocks
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: python3 scripts/stock_assessor.py

      # ── 5-minute gap between Script B and C ───────────────────────────────────
      - name: Wait 5 minutes
        run: sleep 300

      # ── Script C: 48h dedup by ticker, log to Supabase, send Telegram ─────────
      - name: Script C — Dispatch alerts
        env:
          PORTFOLIO_SHEET_ID:             ${{ secrets.PORTFOLIO_SHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: config/service_account.json
          TELEGRAM_BOT_TOKEN:             ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:               ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL:                   ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:      ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_REVALIDATE_URL:             ${{ secrets.APP_REVALIDATE_URL }}
          APP_REVALIDATE_SECRET:          ${{ secrets.APP_REVALIDATE_SECRET }}
        run: python3 scripts/alert_dispatcher.py

      # ── Close-run only: Notion portfolio snapshot + Supabase daily snapshot ────
      - name: Notion snapshot + daily portfolio snapshot (close run only)
        env:
          PORTFOLIO_SHEET_ID:             ${{ secrets.PORTFOLIO_SHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: config/service_account.json
          NOTION_API_KEY:                 ${{ secrets.NOTION_API_KEY }}
          SUPABASE_URL:                   ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:      ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_REVALIDATE_URL:             ${{ secrets.APP_REVALIDATE_URL }}
          APP_REVALIDATE_SECRET:          ${{ secrets.APP_REVALIDATE_SECRET }}
        run: |
          HOUR=$(date -u +"%H")
          if [ "$HOUR" -ge "15" ]; then
            python3 scripts/sheets_updater.py --snapshot
            python3 scripts/daily_portfolio_snapshot.py
          else
            python3 scripts/sheets_updater.py
          fi
