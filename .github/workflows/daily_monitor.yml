name: Daily Monitor

on:
  schedule:
    # 3× daily weekdays: 09:30, 13:00, 16:30 BST (= 08:30, 12:00, 15:30 UTC)
    - cron: '30 8 * * 1-5'   # Morning  — 09:30 BST
    - cron: '0 12 * * 1-5'   # Midday   — 13:00 BST
    - cron: '30 15 * * 1-5'  # Close    — 16:30 BST
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account credentials
        run: |
          mkdir -p config
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > config/service_account.json

      # ── Refresh manual prices (SGLN and other non-GOOGLEFINANCE tickers) ──────
      - name: Refresh manual prices
        env:
          PORTFOLIO_SHEET_ID:             ${{ secrets.PORTFOLIO_SHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: config/service_account.json
        run: python3 scripts/update_manual_prices.py

      # ── market_worker --mode fetch: build news pool ───────────────────────────
      - name: Fetch news
        env:
          FINNHUB_API_KEY:                ${{ secrets.FINNHUB_API_KEY }}
          ALPHAVANTAGE_API_KEY:           ${{ secrets.ALPHAVANTAGE_API_KEY }}
          MARKETAUX_API_KEY:              ${{ secrets.MARKETAUX_API_KEY }}
          CLAUDE_API_KEY:                 ${{ secrets.CLAUDE_API_KEY }}
          PORTFOLIO_SHEET_ID:             ${{ secrets.PORTFOLIO_SHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: config/service_account.json
          SUPABASE_URL:                   ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:      ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_REVALIDATE_URL:             ${{ secrets.APP_REVALIDATE_URL }}
          APP_REVALIDATE_SECRET:          ${{ secrets.APP_REVALIDATE_SECRET }}
        run: python3 scripts/market_worker.py --mode fetch

      # ── 5-minute gap (checkpoint: data/news_pool.json exists) ─────────────────
      - name: Wait 5 minutes
        run: sleep 300

      # ── market_worker --mode assess: score holdings + prospects ───────────────
      - name: Assess stocks
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: python3 scripts/market_worker.py --mode assess

      # ── 5-minute gap (checkpoint: data/assessments.json exists) ───────────────
      - name: Wait 5 minutes
        run: sleep 300

      # ── market_worker --mode dispatch: dedup, log, send Telegram ─────────────
      - name: Dispatch alerts
        env:
          PORTFOLIO_SHEET_ID:             ${{ secrets.PORTFOLIO_SHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: config/service_account.json
          TELEGRAM_BOT_TOKEN:             ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:               ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL:                   ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:      ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_REVALIDATE_URL:             ${{ secrets.APP_REVALIDATE_URL }}
          APP_REVALIDATE_SECRET:          ${{ secrets.APP_REVALIDATE_SECRET }}
        run: python3 scripts/market_worker.py --mode dispatch

      # ── Close-run only: all domain snapshots → Supabase + Notion update ─────────
      - name: Snapshots + Notion update (close run only)
        env:
          PORTFOLIO_SHEET_ID:             ${{ secrets.PORTFOLIO_SHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: config/service_account.json
          NOTION_API_KEY:                 ${{ secrets.NOTION_API_KEY }}
          SUPABASE_URL:                   ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:      ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_REVALIDATE_URL:             ${{ secrets.APP_REVALIDATE_URL }}
          APP_REVALIDATE_SECRET:          ${{ secrets.APP_REVALIDATE_SECRET }}
        run: |
          HOUR=$(date -u +"%H")
          if [ "$HOUR" -ge "15" ]; then
            python3 scripts/snapshot_worker.py --domain all
            python3 scripts/sheets_updater.py --snapshot
          else
            echo "Skipping snapshots — close-run only (current hour UTC: $HOUR)"
          fi
