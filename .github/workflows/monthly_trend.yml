name: Monthly Trend Snapshot

on:
  schedule:
    # Last few days of month (28–31), weekdays, at 16:00 UTC
    # snapshot_trend.py checks internally if today is the actual last weekday
    # and exits silently if not — so this may fire without appending a row
    - cron: '0 16 28-31 * 1-5'
  workflow_dispatch:    # Manual trigger (also passes --force to the script)

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account credentials
        run: |
          mkdir -p config
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > config/service_account.json

      - name: Append monthly trend row
        env:
          PORTFOLIO_SHEET_ID:             ${{ secrets.PORTFOLIO_SHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: config/service_account.json
        run: |
          # Use --force when triggered manually so it always appends
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/snapshot_trend.py --force
          else
            python3 scripts/snapshot_trend.py
          fi
