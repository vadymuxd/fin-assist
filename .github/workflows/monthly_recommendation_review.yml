name: Monthly Recommendation Review

on:
  schedule:
    # 1st of the month, 08:00 BST = 07:00 UTC
    - cron: '0 7 1 * *'
  workflow_dispatch:    # Manual trigger from GitHub UI

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Work 4 (2026-07-04): re-evaluate the current recommendation mechanism
      # (market_worker.py's holdings_alerts) against your actual Custom
      # Stocks portfolio return every month, so mechanism changes get
      # checked on a cadence instead of only when asked. Analyzes only the
      # CURRENT mechanism_version by default (see script docstring).
      - name: Analyze recommendation quality
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN:        ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:          ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/analyze_recommendations.py --telegram
