name: Mortgage Monitor

on:
  schedule:
    # Every Sunday 09:00 BST = 08:00 UTC (weekly market snapshot)
    - cron: '0 8 * * 0'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run mortgage monitor
        env:
          MARKETAUX_API_KEY:  ${{ secrets.MARKETAUX_API_KEY }}
          CLAUDE_API_KEY:     ${{ secrets.CLAUDE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/mortgage_monitor.py

      - name: Commit market snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mortgage/market-snapshots/
          git diff --staged --quiet || git commit -m "chore: mortgage snapshot $(date -u +%Y-%m-%d)"
          git push
