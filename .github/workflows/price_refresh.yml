name: Price Refresh (US/CA Close)

on:
  schedule:
    # 21:30 BST = 20:30 UTC — after NYSE/NASDAQ/TSX close (21:00 BST)
    - cron: '30 20 * * 1-5'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account credentials
        run: |
          mkdir -p config
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > config/service_account.json

      - name: Refresh all prices (US/CA close)
        env:
          PORTFOLIO_SHEET_ID:             ${{ secrets.PORTFOLIO_SHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: config/service_account.json
          TWELVE_DATA_API_KEY:            ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python3 scripts/update_manual_prices.py
