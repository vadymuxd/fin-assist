name: Bot — Sync Snapshots

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account credentials
        run: |
          mkdir -p config
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > config/service_account.json

      - name: Sync all domains (Sheets → Supabase)
        env:
          PORTFOLIO_SHEET_ID:             ${{ secrets.PORTFOLIO_SHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: config/service_account.json
          SUPABASE_URL:                   ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:      ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_REVALIDATE_URL:             ${{ secrets.APP_REVALIDATE_URL }}
          APP_REVALIDATE_SECRET:          ${{ secrets.APP_REVALIDATE_SECRET }}
        run: python3 scripts/snapshot_worker.py --domain all

      - name: Update Notion portfolio snapshot + sheet scores
        env:
          PORTFOLIO_SHEET_ID:             ${{ secrets.PORTFOLIO_SHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: config/service_account.json
          NOTION_API_KEY:                 ${{ secrets.NOTION_API_KEY }}
          SUPABASE_URL:                   ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:      ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_REVALIDATE_URL:             ${{ secrets.APP_REVALIDATE_URL }}
          APP_REVALIDATE_SECRET:          ${{ secrets.APP_REVALIDATE_SECRET }}
        run: python3 scripts/sheets_updater.py --snapshot

      - name: Send Telegram confirmation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="✅ <b>Sync complete</b>%0ASheets → Supabase (portfolio, savings, pensions) + Notion snapshot refreshed." \
            -d parse_mode="HTML"
