name: Bot — Holdings

on:
  workflow_dispatch:  # Triggered by Cloudflare Worker on /holdings (legacy /analyse) command

jobs:
  holdings:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account credentials
        run: |
          mkdir -p config
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > config/service_account.json

      - name: Holdings monitor (bot mode — full status reply)
        env:
          FINNHUB_API_KEY:                ${{ secrets.FINNHUB_API_KEY }}
          ALPHAVANTAGE_API_KEY:           ${{ secrets.ALPHAVANTAGE_API_KEY }}
          CLAUDE_API_KEY:                 ${{ secrets.CLAUDE_API_KEY }}
          PORTFOLIO_SHEET_ID:             ${{ secrets.PORTFOLIO_SHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: config/service_account.json
          TELEGRAM_BOT_TOKEN:             ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:               ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/holdings_monitor.py --bot

      - name: Update sheet scores + Notion snapshot
        env:
          PORTFOLIO_SHEET_ID:             ${{ secrets.PORTFOLIO_SHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: config/service_account.json
          NOTION_API_KEY:                 ${{ secrets.NOTION_API_KEY }}
        run: python3 scripts/sheets_updater.py --snapshot
